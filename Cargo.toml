[workspace]
members = ["programs/*"]
resolver = "2"

[workspace.package]
edition = "2021"
# Program MSRV (= anchor-lang 1.2.1). Tests need >= 1.97.1 (litesvm 0.17 / agave 4.3)
# — rust-toolchain.toml pins 1.99.0 for that.
rust-version = "1.89.0"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
