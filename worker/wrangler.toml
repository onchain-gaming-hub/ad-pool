name = "ad-pool-worker"
main = "build/index.js"
compatibility_date = "2026-10-01"

[build]
command = "worker-build --release"

# Non-secret config. Secrets (.dev.vars locally, `wrangler secret put` when deployed):
#   RPC_URL_DEVNET     keyed RPC (public RPC returns 403 to Workers)
#   MODERATOR_KEYPAIR  Base58 64-byte keypair holding platform-core's Moderator role
#   OPENAI_API_KEY     omni-moderation-latest (A9)
#   WEB_RISK_API_KEY   Web Risk Lookup (A14 layer 2) — separate GCP project, billing on
#   CRANK_KEYPAIR      (W3) Base58 keypair with NO role, fee SOL only — settle / close_auction
[vars]
CLUSTER = "devnet"
# devnet genesis hash — the Worker refuses to act if the RPC is another cluster.
EXPECTED_GENESIS_HASH = "EtWTRABZaYq6iMfeYKouRu166VU2xqa1wcaWoxPkrZBG"
AD_POOL_PROGRAM_ID = "6T2vwUm5EPBAUQaZNcPwEkgK4rHc9AjoET6DaTq3LEqk"
PLATFORM_CORE_PROGRAM_ID = "AJnPSYsn7J2muHfKztRtpZz5kBP94dWkNZLr9aMhu18G"
RPC_TIMEOUT_MS = "10000"
# `domain:` line of signed submissions (FE must use the same value) — set per environment.
AUTH_DOMAIN = "ad-pool.devnet.local"
# Uploaded image cap, bytes (1 KiB..5 MiB).
MAX_IMAGE_BYTES = "1048576"
# Per auction per hour (design §7.3).
MAX_SUBMISSIONS_PER_HOUR = "10"
# Pubkey of MODERATOR_KEYPAIR (RoleMember(Moderator) on devnet — runbook §4). The Worker
# refuses to sign if the secret holds a different key.
MODERATOR_ADDRESS = "DX6bYh6AwfWpBQT8UBevNocYepauHd965RCr1rE6G6Db"
# Origin of `GET /ads/<sha256>.<ext>` → on-chain image_url. ⚠️ placeholder until W6 deploy
# (FE can always derive the object from image_sha256 + the Worker origin).
PUBLIC_BASE_URL = "https://ad-pool.devnet.local"
# Pubkey of CRANK_KEYPAIR (must differ from MODERATOR_ADDRESS).
CRANK_ADDRESS = "ESgASsgG2Uzh4ccQTga5yXoZnkDCCEociVYYe6Trq3LP"

# Subrequests one crank run may spend. Cloudflare: Free 50 · Paid 10,000 per invocation
# (verified 2026-10-10). This Worker targets **Workers Paid** → 900
# (≈ 9 % of the Paid limit: room for ~34 URL re-checks or ~300 settle/close per run).
# Free would also cap CPU at 10 ms — too little for 1 MB image hashing/base64.
SUBREQUEST_BUDGET = "900"

# W3 crank: settle / close due auctions + re-check live click_urls.
[triggers]
crons = ["*/10 * * * *"]

# Approved images, key = ads/<sha256>.<ext> (A4). `wrangler dev` uses a local simulation.
[[r2_buckets]]
binding = "ADS"
bucket_name = "ad-pool-ads-devnet"

# One gate per auction: nonce replay protection + submission rate limit.
[durable_objects]
bindings = [
  { name = "AUCTION_GATE", class_name = "AuctionGate" },
  { name = "RISK_CACHE", class_name = "RiskCache" },
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AuctionGate"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RiskCache"]
